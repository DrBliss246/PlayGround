<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>FLIPPER // CASE LAB</title>
<style>
:root{--orange:#ff9d00;--ink:#0a0b0b;--panel:#171a19;--line:#343936;--green:#b9ff66}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Arial Narrow",Impact,sans-serif;background:#0d0f0e;color:#eef2ed;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}.shell{height:100%;display:grid;grid-template-columns:72px 1fr 286px}.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0}.mark{width:42px;height:42px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);font-size:12px;transform:rotate(-8deg)}.railnav{margin-top:42px;display:flex;flex-direction:column;gap:12px}.railbtn{width:44px;height:44px;background:transparent;border:0;border-left:3px solid transparent;color:#727873;font-size:19px}.railbtn.active{color:var(--orange);border-left-color:var(--orange);background:linear-gradient(90deg,#24190b,transparent)}
main{min-width:0;padding:24px 28px 18px;display:flex;flex-direction:column}.topbar{height:46px;display:flex;align-items:flex-start;justify-content:space-between}.eyebrow{font-family:monospace;color:#858d88;font-size:11px;letter-spacing:.22em}.brand{font-size:24px;letter-spacing:.06em}.brand b{color:var(--orange)}.wallet{height:38px;border:1px solid var(--line);background:#111311;padding:0 12px;display:flex;align-items:center;gap:9px;font-family:monospace}.wallet i{width:9px;height:9px;border:2px solid var(--orange);transform:rotate(45deg)}
.stage{flex:1;position:relative;min-height:340px;border:1px solid #252925;margin-top:10px;background:radial-gradient(circle at 50% 45%,#202523 0,#141716 46%,#0c0e0d 78%);overflow:hidden}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.85%,#ffffff08 50%,transparent 50.15%),linear-gradient(transparent 49.85%,#ffffff08 50%,transparent 50.15%)}
.case-wrap{position:absolute;left:50%;top:48%;width:min(44vw,430px);height:min(29vw,280px);transform:translate(-50%,-50%);perspective:900px}.case{position:absolute;inset:0;transition:.5s cubic-bezier(.2,.8,.2,1)}.case-shadow{position:absolute;left:12%;right:12%;bottom:-28px;height:38px;background:#000;border-radius:50%;filter:blur(12px);opacity:.75}.lid,.box{position:absolute;left:7%;width:86%;border:3px solid #2b302e}.lid{height:44%;top:3%;border-radius:18px 18px 5px 5px;background:linear-gradient(145deg,#303633,#161918);transform-origin:bottom;transform:rotateX(0);box-shadow:inset 0 3px #505651}.lid:before{content:"";position:absolute;left:12%;right:12%;top:18%;height:42%;border:2px solid #202422;border-radius:9px;background:linear-gradient(135deg,#252a28,#111);}.lid:after{content:"FLIPPER // C";position:absolute;left:22%;bottom:-25px;color:#9aa29d;font:11px monospace;letter-spacing:.12em}.box{height:64%;bottom:4%;border-radius:6px 6px 22px 22px;background:linear-gradient(145deg,#3b403d,#171a18 70%);box-shadow:inset 0 -12px 18px #090a09,inset 0 2px #626963}.box:before{content:"";position:absolute;left:13%;right:13%;bottom:11%;height:28%;border:2px solid #252927;border-radius:3px}.clasp{position:absolute;z-index:3;width:54px;height:25px;left:calc(50% - 27px);top:43%;border:3px solid #1b1e1d;border-radius:4px;background:#ff9d00;box-shadow:0 3px 8px #000}.case.open .lid{transform:translateY(-18%) rotateX(-62deg)}.case.open .clasp{transform:scaleY(.2);background:#555}
.reward{position:absolute;z-index:4;left:50%;top:54%;transform:translate(-50%,10%) scale(.2) rotate(-10deg);width:120px;height:190px;opacity:0;transition:.7s cubic-bezier(.2,.9,.2,1)}.reward.show{opacity:1;transform:translate(-50%,-5%) scale(1) rotate(0)}.device{position:absolute;inset:8px 13px 18px;border-radius:14px 14px 18px 18px;background:linear-gradient(135deg,#c9d0cb,#7e8882);border:3px solid #e5ebe6;box-shadow:0 12px 22px #000b}.device:before{content:"";position:absolute;width:48px;height:38px;left:50%;top:20px;transform:translateX(-50%);background:#a8b0aa;border:2px solid #667068;border-radius:3px}.screen{position:absolute;left:17px;right:17px;top:66px;height:62px;border:4px solid #303735;border-radius:4px;background:#ff9d00;box-shadow:inset 0 0 16px #ffe1a1}.screen:before{content:"_";position:absolute;left:8px;top:-1px;font:28px monospace;color:#20231f}.device:after{content:"";position:absolute;left:50%;bottom:11px;width:42px;height:42px;border:3px solid #68716c;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,#9ba49f 0 17%,#626c66 19% 28%,#adb5b0 30%)}
.rarity-glow{position:absolute;left:50%;top:50%;width:280px;height:280px;border-radius:50%;transform:translate(-50%,-50%) scale(.3);background:radial-gradient(circle,#ff9d0044,transparent 68%);opacity:0}.rarity-glow.show{animation:pulse 1.2s ease-out}.particles{position:absolute;inset:0;pointer-events:none}.particle{position:absolute;width:5px;height:14px;background:var(--orange);animation:burst 1.1s ease-out forwards}@keyframes burst{to{transform:translate(var(--tx),var(--ty)) rotate(480deg);opacity:0}}@keyframes pulse{60%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0}}
.bottom{height:92px;display:flex;align-items:center;justify-content:space-between}.odds{display:flex;gap:18px}.odd{font:11px monospace;color:#7e8782}.odd b{display:block;margin-top:5px;font-size:13px}.odd:nth-child(1) b{color:#bfc7c2}.odd:nth-child(2) b{color:#75aaff}.odd:nth-child(3) b{color:#d79aff}.odd:nth-child(4) b{color:var(--orange)}
.openbtn{height:58px;min-width:210px;border:1px solid #ffb43d;background:var(--orange);color:#15120d;font-size:19px;letter-spacing:.08em;box-shadow:8px 8px 0 #2b1a06}.openbtn:active{transform:translate(4px,4px);box-shadow:4px 4px 0 #2b1a06}.openbtn:disabled{filter:saturate(.2);cursor:wait}
aside{border-left:1px solid var(--line);background:#111311;display:flex;flex-direction:column}.aside-head{height:82px;padding:24px 20px 16px;border-bottom:1px solid var(--line)}.aside-head h2{margin:0;font-size:16px}.aside-head small{font:10px monospace;color:#737b76}.inventory{padding:12px 20px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}.item{height:94px;border:1px solid #2b302d;position:relative;background:#171a18;padding:8px}.item.selected{border-color:var(--orange)}.item .mini{width:34px;height:55px;margin:auto;border-radius:5px;background:linear-gradient(135deg,#bac2bd,#7c8580);border:2px solid #dce2de;position:relative}.item .mini:before{content:"";position:absolute;left:5px;right:5px;top:19px;height:18px;background:#ff9d00;border:2px solid #343936}.item .qty{position:absolute;right:7px;bottom:6px;font:10px monospace;color:#abb3ae}.item .name{position:absolute;left:7px;top:6px;font:8px monospace;color:#929b96}.empty{grid-column:1/-1;color:#626963;text-align:center;font:11px monospace;padding:30px 0}
.toast{position:absolute;z-index:8;left:50%;top:17%;transform:translate(-50%,-20px);background:#eff3ef;color:#171917;padding:10px 14px;font:12px monospace;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){body{overflow:auto}.shell{min-height:100%;height:auto;grid-template-columns:54px 1fr}.rail{padding-top:10px}.railnav{margin-top:18px}.mark{width:36px;height:36px}.shell aside{position:absolute;right:0;top:0;width:220px;height:100%;transform:translateX(100%)}main{height:100vh;padding:14px 12px}.case-wrap{width:72vw;height:47vw}.odds{display:none}.brand{font-size:18px}.stage{min-height:300px}.bottom{height:80px}.openbtn{min-width:170px}.shell{grid-template-columns:48px 1fr}}
</style>
</head>
<body>
<div class="shell">
<nav class="rail"><div class="mark">F•Z</div><div class="railnav"><button class="railbtn active" title="Case Lab">▣</button><button class="railbtn" title="Signal">⌁</button><button class="railbtn" title="Stats">≡</button></div></nav>
<main>
<div class="topbar"><div><div class="eyebrow">GEAR LAB / 024</div><div class="brand">FLIPPER <b>CASE LAB</b></div></div><div class="wallet"><i></i><span id="coins">2,500</span> C</div></div>
<section class="stage"><div class="rarity-glow" id="glow"></div><div class="particles" id="particles"></div><div class="toast" id="toast">CASE OPENED</div>
<div class="case-wrap"><div class="case" id="case"><div class="case-shadow"></div><div class="lid"></div><div class="clasp"></div><div class="box"></div></div><div class="reward" id="reward"><div class="device"><div class="screen"></div></div></div></div>
</section>
<div class="bottom"><div class="odds"><div class="odd">COMMON<b>70%</b></div><div class="odd">RARE<b>20%</b></div><div class="odd">EPIC<b>8%</b></div><div class="odd">LEGENDARY<b>2%</b></div></div><button class="openbtn" id="openBtn">OPEN CASE • 100 C</button></div>
</main>
<aside><div class="aside-head"><h2>INVENTORY</h2><small id="count">0 / 12 SLOTS</small></div><div class="inventory" id="inventory"><div class="empty">NO GEAR ACQUIRED</div></div></aside>
</div>
<script>
const $=s=>document.querySelector(s),caseEl=$('#case'),reward=$('#reward'),btn=$('#openBtn'),coinsEl=$('#coins'),inv=$('#inventory'),toast=$('#toast'),glow=$('#glow'),parts=$('#particles');
let coins=2500,opening=false,items=[];
const rarities=[{name:'COMMON',p:70,color:'#bfc7c2'},{name:'RARE',p:90,color:'#75aaff'},{name:'EPIC',p:98,color:'#d79aff'},{name:'LEGENDARY',p:100,color:'#ff9d00'}];
function randRoll(){const r=Math.random()*100;return rarities.find(x=>r<x.p)}
function fmt(n){return n.toLocaleString('en-US')}
function openCase(){if(opening)return;if(coins<100){toast.textContent='NOT ENOUGH CREDITS';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900);return}coins-=100;coinsEl.textContent=fmt(coins);opening=true;btn.disabled=true;reward.classList.remove('show');caseEl.classList.remove('open');glow.classList.remove('show');void caseEl.offsetWidth;caseEl.classList.add('open');setTimeout(()=>{const item=randRoll();for(let i=0;i<32;i++){const p=document.createElement('i');p.className='particle';p.style.left=(48+Math.random()*4)+'%';p.style.top=(48+Math.random()*4)+'%';p.style.setProperty('--tx',(Math.random()*500-250)+'px');p.style.setProperty('--ty',(Math.random()*380-190)+'px');p.style.background=item.color;parts.appendChild(p);setTimeout(()=>p.remove(),1200)}glow.style.background=`radial-gradient(circle,${item.color}55,transparent 68%)`;glow.classList.add('show');reward.style.filter=`drop-shadow(0 0 18px ${item.color})`;reward.classList.add('show');toast.textContent=item.name+' GEAR ACQUIRED';toast.style.color=item.color===' '+''?'':'#'+'';toast.classList.add('show');items.unshift(item);renderInv()},750);setTimeout(()=>{toast.classList.remove('show');caseEl.classList.remove('open');reward.classList.remove('show');btn.disabled=false;opening=false},2700)}
function renderInv(){inv.innerHTML='';if(!items.length){inv.innerHTML='<div class="empty">NO GEAR ACQUIRED</div>';return}const counts={};items.forEach(x=>counts[x.name]=(counts[x.name]||0)+1);Object.entries(counts).slice(0,12).forEach(([name,qty])=>{const rarity=rarities.find(r=>r.name===name);const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="name">${name}</div><div class="mini"></div><div class="qty">×${qty}</div>`;el.querySelector('.mini').style.boxShadow=`0 0 12px ${rarity.color}44`;inv.appendChild(el)});$('#count').textContent=items.length+' / 12 SLOTS'}
btn.addEventListener('click',openCase);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')openCase()});
</script>
</body>
</html>
